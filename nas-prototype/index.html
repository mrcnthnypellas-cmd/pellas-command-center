<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QMARC NASH Server</title>
<style>
/* ==========================================================================
   PRIVATE SERVER — PHASE 1 PROTOTYPE
   Self-contained. Simulated data only. No network requests, no disk access.
   ========================================================================== */
:root{
  --bg:#edf0f2; --surface:#ffffff; --surface-2:#f5f7f8; --surface-3:#e7ebee;
  --line:#dbe1e5; --line-2:#c7d0d6;
  --ink:#14202a; --ink-2:#44545f; --muted:#72818c;
  --accent:#0d7680; --accent-2:#0a5f67; --accent-ink:#ffffff; --accent-soft:#dcefef;
  --ok:#1d8048; --ok-soft:#def2e5; --warn:#a2680f; --warn-soft:#fbefd6;
  --bad:#bf3b35; --bad-soft:#fbe3e1; --info:#2d64a8; --info-soft:#e1ebf7;
  --vio:#6d4fb3; --vio-soft:#ece6f8; --org:#bb5519; --org-soft:#fbe8dc;
  --folder:#d39a2c; --folder-2:#e8b64f;
  --side:#0f1b23; --side-2:#15252e; --side-3:#1b2f3a; --side-ink:#c8d3da; --side-muted:#7d8f9a; --side-line:#1d2e38;
  --side-accent:#3cc4cc; --logo-a:#1a8f99; --logo-b:#0b5a61;
  --shadow:0 1px 2px rgba(15,30,40,.06),0 2px 8px rgba(15,30,40,.04);
  --shadow-lg:0 20px 60px rgba(8,20,28,.30);
  --scrim:rgba(9,18,24,.52);
  --r:10px; --r-sm:7px;
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:"Cascadia Mono","Cascadia Code",Consolas,ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0b1115; --surface:#121a20; --surface-2:#162028; --surface-3:#1d2831;
    --line:#233039; --line-2:#2f3e48;
    --ink:#e1e8ed; --ink-2:#a8b6c0; --muted:#73838e;
    --accent:#35b6bf; --accent-2:#5fcbd2; --accent-ink:#04272a; --accent-soft:#0f2d32;
    --ok:#44c07d; --ok-soft:#11291d; --warn:#e2aa4c; --warn-soft:#2c2313;
    --bad:#ee6a63; --bad-soft:#321716; --info:#6ea5e8; --info-soft:#13233a;
    --vio:#a48ae6; --vio-soft:#221b37; --org:#ec8a4e; --org-soft:#2e1d12;
    --folder:#d9a441; --folder-2:#b98526;
    --side:#080e12; --side-2:#0f1a21; --side-3:#15252e; --side-line:#16242c;
    --shadow:0 1px 2px rgba(0,0,0,.3);
    --scrim:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0b1115; --surface:#121a20; --surface-2:#162028; --surface-3:#1d2831;
  --line:#233039; --line-2:#2f3e48;
  --ink:#e1e8ed; --ink-2:#a8b6c0; --muted:#73838e;
  --accent:#35b6bf; --accent-2:#5fcbd2; --accent-ink:#04272a; --accent-soft:#0f2d32;
  --ok:#44c07d; --ok-soft:#11291d; --warn:#e2aa4c; --warn-soft:#2c2313;
  --bad:#ee6a63; --bad-soft:#321716; --info:#6ea5e8; --info-soft:#13233a;
  --vio:#a48ae6; --vio-soft:#221b37; --org:#ec8a4e; --org-soft:#2e1d12;
  --folder:#d9a441; --folder-2:#b98526;
  --side:#080e12; --side-2:#0f1a21; --side-3:#15252e; --side-line:#16242c;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --scrim:rgba(0,0,0,.6);
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.mono{font-family:var(--mono);font-size:.92em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ink2{color:var(--ink-2)}
.ic{flex:none;display:inline-block;vertical-align:middle}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.sidebar{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;border-right:1px solid var(--side-line);z-index:40}
.brand{display:flex;align-items:center;gap:12px;padding:18px 18px 16px;border-bottom:1px solid var(--side-line)}
.logo{width:34px;height:34px;border-radius:8px;background:linear-gradient(160deg,var(--logo-a),var(--logo-b));display:grid;place-content:center;gap:3px;padding:0 8px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.logo i{display:block;width:18px;height:4px;border-radius:2px;background:rgba(255,255,255,.9);position:relative}
.logo i::after{content:"";position:absolute;right:2px;top:1px;width:2px;height:2px;border-radius:50%;background:#7ff0c0}
.brand-t{min-width:0}
.brand-t b{display:block;font-size:13.5px;line-height:1.25;letter-spacing:.2px;color:#fff;overflow-wrap:anywhere}
.brand-t span{display:block;font-size:11.5px;color:var(--side-muted)}
.nav{flex:1;overflow-y:auto;padding:10px 10px 12px}
.nav-sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--side-muted);padding:14px 10px 6px}
.nav-i{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;color:var(--side-ink);padding:8px 10px;border-radius:7px;text-align:left;font-size:13.5px;position:relative}
.nav-i:hover{background:var(--side-2);color:#fff}
.nav-i.on{background:var(--side-3);color:#fff}
.nav-i.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--side-accent)}
.nav-i .ic{opacity:.85}
.nav-i .badge{margin-left:auto;font-size:11px;background:#23414d;color:#bfe9ec;border-radius:10px;padding:0 7px;line-height:18px}
.side-foot{border-top:1px solid var(--side-line);padding:14px 16px 16px;display:grid;gap:12px}
.side-meter{font-size:12px;color:var(--side-muted);display:grid;gap:6px}
.side-meter .bar{height:5px;border-radius:3px;background:var(--side-3);overflow:hidden}
.side-meter .bar i{display:block;height:100%;background:var(--side-accent);border-radius:3px}
.side-btn{display:flex;align-items:center;gap:8px;justify-content:center;border:1px solid #28414d;background:transparent;color:var(--side-ink);border-radius:7px;padding:7px 10px;font-size:12.5px}
.side-btn:hover{background:var(--side-2);color:#fff}
.scrim{display:none}

.main{min-width:0;display:flex;flex-direction:column}
.demo-strip{background:repeating-linear-gradient(135deg,var(--warn-soft) 0 12px,transparent 12px 24px),var(--surface);border-bottom:1px solid var(--line);color:var(--warn);font-size:12px;padding:5px 28px;display:flex;align-items:center;gap:8px}
.demo-strip b{letter-spacing:.06em;text-transform:uppercase;font-size:11px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 28px;min-height:60px}
.icon-btn.hamb{display:none}
.page-t{min-width:0;flex:1}
.page-t h1{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page-t p{margin:0;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;align-items:center;gap:6px}
.status-chip{display:flex;align-items:center;gap:7px;font-size:12.5px;border:1px solid var(--line);border-radius:20px;padding:4px 11px 4px 9px;background:var(--surface-2);white-space:nowrap}
.icon-btn{position:relative;width:36px;height:36px;border-radius:8px;border:1px solid transparent;background:none;display:grid;place-items:center;color:var(--ink-2)}
.icon-btn:hover{background:var(--surface-2);border-color:var(--line)}
.icon-btn .dot{position:absolute;top:6px;right:6px;min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;line-height:16px;padding:0 4px;font-weight:600}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent);flex:none}
.avatar.sm{width:28px;height:28px;font-size:11px}
.user-btn{display:flex;align-items:center;gap:8px;border:0;background:none;padding:3px 6px 3px 3px;border-radius:20px}
.user-btn:hover{background:var(--surface-2)}
.user-btn span{font-size:13px}
.content{padding:24px 28px 56px;width:100%;max-width:1480px}

/* ---------- Status dots & pills ---------- */
.dot-s{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none;display:inline-block}
.dot-s.ok{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.dot-s.warn{background:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}
.dot-s.bad{background:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.dot-s.pulse{animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(29,128,72,.45)}70%{box-shadow:0 0 0 8px rgba(29,128,72,0)}100%{box-shadow:0 0 0 0 rgba(29,128,72,0)}}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:20px;padding:2px 10px;line-height:20px;white-space:nowrap;background:var(--surface-3);color:var(--ink-2)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.vio{background:var(--vio-soft);color:var(--vio)}
.pill .dot-s{width:6px;height:6px;box-shadow:none}
.tag{display:inline-block;font-size:11.5px;border:1px solid var(--line);border-radius:5px;padding:0 6px;line-height:19px;color:var(--ink-2);background:var(--surface-2);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:4px}

/* ---------- Buttons & form controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:var(--r-sm);padding:7px 13px;font-size:13px;font-weight:500;white-space:nowrap;line-height:18px}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.danger{color:var(--bad);border-color:var(--line-2)}
.btn.danger:hover{background:var(--bad-soft)}
.btn.danger.solid{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.icon{padding:6px;width:32px;height:32px}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.input,.select{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-sm);padding:8px 11px;font-size:13.5px;line-height:18px}
.input:focus,.select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.input.err{border-color:var(--bad)}
.search{position:relative;min-width:0}
.search .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .input{padding-left:34px}
.field{display:grid;gap:6px}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.field .hint{font-size:12px;color:var(--muted)}
.field .err-t{font-size:12px;color:var(--bad)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.form-grid .full{grid-column:1/-1}
.switch{width:38px;height:22px;border-radius:11px;border:0;background:var(--line-2);position:relative;flex:none;transition:background .15s;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(16px)}
.switch:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 11px;font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.check{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}

/* ---------- Cards & layout ---------- */
.grid{display:grid;gap:16px}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g-1-2{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.stack{display:grid;gap:16px;align-content:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px 0;min-height:44px}
.card-h h2{margin:0;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.card-h .sp{flex:1}
.card-b{padding:14px 16px 16px}
.card-b.flush{padding:8px 0 0}
.card-f{border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:9px 14px;font-size:13px;align-items:center}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-weight:500;min-width:0;overflow-wrap:anywhere}
.big-stat{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.big-stat small{font-size:14px;color:var(--muted);font-weight:500;letter-spacing:0}
.meter{height:7px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px;background:var(--accent);transition:width .6s ease}
.meter.lg{height:12px;border-radius:6px}
.meter i.warn{background:var(--warn)} .meter i.bad{background:var(--bad)} .meter i.info{background:var(--info)}
.mrow{display:grid;gap:5px}
.mrow .l{display:flex;justify-content:space-between;font-size:12.5px;gap:8px}
.mrow .l span:first-child{color:var(--ink-2)}
.divider{height:1px;background:var(--line);margin:4px 0}
.section-t{font-size:15px;font-weight:600;margin:0 0 4px}
.lead{color:var(--muted);margin:0;font-size:13px}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.empty .ic{color:var(--line-2);margin-bottom:8px}

/* banner */
.banner{display:flex;align-items:center;gap:14px;background:linear-gradient(100deg,var(--accent-soft),var(--surface) 70%);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:16px}
.banner .b-ic{width:38px;height:38px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.banner .b-t{flex:1 1 260px;min-width:0}
.banner b{display:block;font-size:14px}
.banner span{font-size:12.5px;color:var(--ink-2)}

/* tables */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl th:first-child,.tbl td:first-child{padding-left:16px}
.tbl th:last-child,.tbl td:last-child{padding-right:16px}
.tbl .r{text-align:right}
.tbl th.sortable{cursor:pointer;user-select:none}
.tbl th.sortable:hover{color:var(--ink)}
.tbl tr.sel td{background:var(--accent-soft)!important}
.cell-main{display:flex;align-items:center;gap:10px;min-width:0}
.cell-main .t{min-width:0}
.cell-main b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell-main small{color:var(--muted);font-size:12px;display:block}
.row-actions{display:flex;gap:4px;justify-content:flex-end}

/* activity feed */
.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;gap:12px;padding:10px 16px;border-top:1px solid var(--line);align-items:flex-start}
.feed li:first-child{border-top:0}
.feed .f-ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
.feed .f-t{flex:1;min-width:0;font-size:13px}
.feed .f-t small{display:block;color:var(--muted);font-size:12px}
.feed time{font-size:12px;color:var(--muted);white-space:nowrap}
.t-ok{background:var(--ok-soft);color:var(--ok)} .t-info{background:var(--info-soft);color:var(--info)}
.t-warn{background:var(--warn-soft);color:var(--warn)} .t-bad{background:var(--bad-soft);color:var(--bad)}
.t-acc{background:var(--accent-soft);color:var(--accent)} .t-vio{background:var(--vio-soft);color:var(--vio)}

/* charts */
.spark{display:block;width:100%;height:70px}
.spark .grid-l{stroke:var(--line);stroke-width:1}
.spark .s-a{stroke:var(--accent);fill:none;stroke-width:2}
.spark .s-a-f{fill:var(--accent);opacity:.13}
.spark .s-b{stroke:var(--info);fill:none;stroke-width:2}
.spark .s-b-f{fill:var(--info);opacity:.10}
.spark .s-c{stroke:var(--vio);fill:none;stroke-width:2}
.spark .s-c-f{fill:var(--vio);opacity:.12}
.perf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0}
.perf>div{padding:12px 16px 14px;border-left:1px solid var(--line);min-width:0}
.perf>div:first-child{border-left:0}
.perf .p-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.perf .p-h span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.perf .p-h b{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.perf .p-f{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.donut{position:relative;flex:none}
.donut svg{display:block;transform:rotate(-90deg)}
.donut .d-bg{stroke:var(--surface-3)}
.donut .d-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut .d-c b{font-size:22px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.donut .d-c small{font-size:11px;color:var(--muted);margin-top:3px}
.stackbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface-3);gap:2px}
.stackbar i{display:block;height:100%}

/* drives */
.drive{display:grid;gap:14px}
.drive-h{display:flex;gap:14px;align-items:center}
.drive-art{width:52px;height:60px;border-radius:8px;background:linear-gradient(180deg,var(--surface-3),var(--surface-2));border:1px solid var(--line-2);position:relative;flex:none;display:grid;place-items:center;color:var(--ink-2)}
.drive-art::after{content:"";position:absolute;bottom:7px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok)}
.drive-art.off::after{background:var(--muted);box-shadow:none}
.drive-h .t{flex:1;min-width:0}
.drive-h h3{margin:0;font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.drive-h p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.spec{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.spec>div{background:var(--surface);padding:9px 11px;min-width:0}
.spec span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.spec b{display:block;font-size:13.5px;font-weight:600;margin-top:2px;overflow-wrap:anywhere}

/* file manager */
.fm{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:560px}
.fm-tree{border-right:1px solid var(--line);padding:10px 8px;overflow:auto;background:var(--surface-2);border-radius:var(--r) 0 0 var(--r)}
.fm-tree .tn{display:flex;align-items:center;gap:7px;width:100%;border:0;background:none;padding:5px 8px;border-radius:6px;font-size:13px;text-align:left;color:var(--ink-2);white-space:nowrap}
.fm-tree .tn:hover{background:var(--surface-3)}
.fm-tree .tn.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.fm-tree .tn .ic{color:var(--folder)}
.fm-tree .tsub{padding-left:14px}
.fm-tree .t-h{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:6px 8px;font-weight:600}
.fm-main{min-width:0;display:flex;flex-direction:column}
.fm-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.fm-bar .search{flex:1 1 200px;max-width:320px}
.fm-bar .sp{flex:1}
.crumbs{display:flex;align-items:center;gap:2px;flex-wrap:wrap;padding:10px 14px;font-size:13px;border-bottom:1px solid var(--line)}
.crumbs button{border:0;background:none;padding:3px 6px;border-radius:5px;color:var(--ink-2)}
.crumbs button:hover{background:var(--surface-2);color:var(--ink)}
.crumbs button.cur{color:var(--ink);font-weight:600}
.crumbs .ic{color:var(--muted)}
.fm-sel{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:600;flex-wrap:wrap}
.fm-list{flex:1}
.fname{display:flex;align-items:center;gap:10px;min-width:0;border:0;background:none;padding:0;text-align:left;color:var(--ink)}
.fname span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
button.fname:hover span{color:var(--accent);text-decoration:underline}
.fbadge{width:28px;height:34px;border-radius:4px;display:grid;place-items:end center;padding-bottom:4px;font-size:8.5px;font-weight:700;letter-spacing:.03em;flex:none;position:relative}
.fbadge::before{content:"";position:absolute;top:0;right:0;border-width:0 8px 8px 0;border-style:solid;border-color:transparent var(--surface) transparent transparent;filter:brightness(.92)}
.fb-pdf{background:var(--bad-soft);color:var(--bad)} .fb-xls{background:var(--ok-soft);color:var(--ok)}
.fb-doc{background:var(--info-soft);color:var(--info)} .fb-ppt{background:var(--org-soft);color:var(--org)}
.fb-zip{background:var(--warn-soft);color:var(--warn)} .fb-img{background:var(--vio-soft);color:var(--vio)}
.fb-oth{background:var(--surface-3);color:var(--ink-2)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px;padding:14px}
.ftile{border:1px solid var(--line);border-radius:9px;padding:14px 10px 10px;display:grid;justify-items:center;gap:8px;text-align:center;position:relative;background:var(--surface);cursor:default}
.ftile:hover{border-color:var(--line-2);background:var(--surface-2)}
.ftile.sel{border-color:var(--accent);background:var(--accent-soft)}
.ftile .check{position:absolute;top:8px;left:8px}
.ftile .more{position:absolute;top:4px;right:4px}
.ftile .fbadge{width:42px;height:52px;font-size:10px;padding-bottom:6px}
.ftile .nm{font-size:12.5px;font-weight:500;overflow-wrap:anywhere;line-height:1.3;max-height:2.6em;overflow:hidden}
.ftile .meta{font-size:11.5px;color:var(--muted)}
.ftile.folder{cursor:pointer}

/* permissions */
.perm-cell{white-space:nowrap;border:1px solid transparent;border-radius:6px;padding:4px 9px;font-size:12px;font-weight:600;min-width:94px;display:inline-flex;align-items:center;gap:5px;justify-content:center}
.perm-cell:hover{border-color:var(--line-2)}
.lv0{background:var(--surface-3);color:var(--muted)} .lv1{background:var(--info-soft);color:var(--info)}
.lv2{background:var(--accent-soft);color:var(--accent)} .lv3{background:var(--ok-soft);color:var(--ok)}
.perm-cell:disabled{cursor:not-allowed;opacity:.85}
.yesno{width:30px;height:30px;border-radius:7px;border:1px solid transparent;display:inline-grid;place-items:center}
.yesno.y{background:var(--ok-soft);color:var(--ok)} .yesno.n{background:var(--bad-soft);color:var(--bad)}
.yesno:hover{border-color:var(--line-2)}
.yesno:disabled{cursor:not-allowed}
.th-role{border:0;background:none;padding:0;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;display:inline-flex;align-items:center;gap:5px}
.th-role.on{color:var(--accent)}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:13.5px}
.plist li{display:flex;align-items:center;gap:9px;padding:5px 0}
.plist .y{color:var(--ok)} .plist .n{color:var(--bad)}
.plist small{margin-left:auto;color:var(--muted);font-size:12px}

/* remote */
.remote-hero{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:0}
.rh-status{padding:22px;border-right:1px solid var(--line);display:grid;gap:14px;align-content:start}
.rh-status .st{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.rh-status .big{font-size:30px;font-weight:700;letter-spacing:.02em;display:flex;align-items:center;gap:12px}
.rh-status .big.ok{color:var(--ok)} .rh-status .big.off{color:var(--muted)} .rh-status .big.warn{color:var(--warn)}
.rh-detail{padding:18px 22px}
.copyable{display:inline-flex;align-items:center;gap:6px}
.copyable button{border:0;background:none;color:var(--muted);padding:2px;border-radius:4px;display:grid}
.copyable button:hover{color:var(--accent);background:var(--surface-2)}
.path{display:flex;align-items:center;gap:0;padding:18px 16px 20px;overflow-x:auto}
.path .node{display:grid;justify-items:center;gap:6px;text-align:center;min-width:104px;flex:none}
.path .node .n-ic{width:48px;height:48px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-2)}
.path .node.hl .n-ic{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.path .node b{font-size:12.5px}
.path .node small{font-size:11.5px;color:var(--muted);max-width:130px}
.path .link{flex:1;min-width:40px;height:2px;margin:0 4px 40px;background:repeating-linear-gradient(90deg,var(--accent) 0 6px,transparent 6px 12px);background-size:24px 2px;animation:flow 1s linear infinite}
.path .link.off{background:repeating-linear-gradient(90deg,var(--line-2) 0 6px,transparent 6px 12px);animation:none}
@keyframes flow{to{background-position:24px 0}}
.qr{display:grid;grid-template-columns:repeat(21,1fr);width:168px;height:168px;padding:8px;background:#fff;border-radius:8px;border:1px solid var(--line)}
.qr i{background:#0f1b23}
.qr i.w{background:#fff}
.pair-code{font-family:var(--mono);font-size:26px;letter-spacing:.18em;font-weight:600}

/* security */
.sec-tile{display:flex;gap:12px;align-items:center;padding:14px 16px}
.sec-tile .s-ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none}
.sec-tile .t{min-width:0;flex:1}
.sec-tile span{display:block;font-size:12px;color:var(--muted)}
.sec-tile b{display:block;font-size:15px}
.checklist{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.checklist li{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13px;border-top:1px solid var(--line)}
.checklist li:first-child{border-top:0}
.checklist li .sp{flex:1}

/* backup */
.bk-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.bk-grid>div{background:var(--surface);padding:14px 16px;min-width:0}
.bk-grid span{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.bk-grid b{display:flex;align-items:center;gap:7px;font-size:15px;margin-top:4px;font-weight:600}
.progress-box{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--surface-2);display:grid;gap:8px}
.progress-box .l{display:flex;justify-content:space-between;font-size:13px;gap:10px}
.stages{display:flex;gap:6px;flex-wrap:wrap;font-size:12px}
.stages span{padding:2px 8px;border-radius:12px;background:var(--surface-3);color:var(--muted)}
.stages span.done{background:var(--ok-soft);color:var(--ok)}
.stages span.cur{background:var(--accent-soft);color:var(--accent);font-weight:600}

/* settings */
.settings{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;align-items:start}
.set-nav{padding:8px;position:sticky;top:80px}
.set-nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:7px;font-size:13.5px;text-align:left;color:var(--ink-2)}
.set-nav button:hover{background:var(--surface-2)}
.set-nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.set-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,320px);gap:16px;align-items:center;padding:14px 18px;border-top:1px solid var(--line)}
.set-row:first-child{border-top:0}
.set-row .lbl b{display:block;font-size:13.5px;font-weight:600}
.set-row .lbl span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.set-row .ctl{display:flex;justify-content:flex-end}
.set-row .ctl .input,.set-row .ctl .select{max-width:320px}
.set-sec-h{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}
.set-sec-h h2{margin:0;font-size:16px}
.set-sec-h p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.save-bar{position:sticky;bottom:0;display:flex;gap:8px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface);border-radius:0 0 var(--r) var(--r)}
.save-bar .sp{flex:1}

/* appearance */
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line-2);padding:0;display:grid;place-items:center;color:#fff}
.swatch:hover{transform:scale(1.08)}
.swatch.on{box-shadow:0 0 0 2px var(--ink)}
.color-in{width:34px;height:34px;padding:2px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);cursor:pointer}
.color-lbl{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.ap-block{padding:16px 18px;border-top:1px solid var(--line);display:grid;gap:14px}
.ap-block h3{margin:0;font-size:13.5px}
.ap-block>p{margin:-8px 0 0;font-size:12.5px;color:var(--muted)}
.bg-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.bg-tile{height:72px;border-radius:9px;border:2px solid transparent;box-shadow:0 0 0 1px var(--line-2);display:flex;align-items:flex-end;padding:6px 8px;color:#fff;font-size:12px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.6);text-align:left;gap:5px}
.bg-tile.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.bg-tile.dash{background:var(--surface-2);color:var(--ink-2);text-shadow:none;border:2px dashed var(--line-2);box-shadow:none;align-items:center;justify-content:center;flex-direction:column}
.bg-tile.dash.on{border-color:var(--accent);border-style:solid}
.ap-inline{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center}
.ap-inline input[type=range]{accent-color:var(--accent);width:160px}
.login-prev{height:230px;border-radius:10px;display:grid;place-items:center;overflow:hidden;border:1px solid var(--line);padding:16px}
.mini{width:220px;max-width:100%;background:rgba(18,30,37,.86);border:1px solid #21363f;border-radius:10px;padding:14px;color:#e1e8ed;display:grid;gap:7px;font-size:11px;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.mini .mh{display:flex;gap:8px;align-items:center}
.mini .mh .logo{width:22px;height:22px;border-radius:5px;padding:0 5px;gap:2px}
.mini .mh .logo i{width:12px;height:2.5px}
.mini .mh .logo i::after{display:none}
.mini b{font-size:12px}
.mini span{color:#8ea0aa}
.mini i.f{display:block;height:18px;border-radius:5px;background:#0e181d;border:1px solid #2a3f49}
.mini i.b{display:block;height:20px;border-radius:5px;background:var(--accent)}
.login-custom{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:8px}
.login-custom .btn{background:rgba(10,18,22,.6);border-color:rgba(255,255,255,.18);color:#e1e8ed;backdrop-filter:blur(6px)}
.login-custom .btn:hover{background:rgba(10,18,22,.8)}
.login .msg{color:#c9d6dd;font-size:13.5px}

/* ---------- Overlays ---------- */
.modal-back{position:fixed;inset:0;background:var(--scrim);z-index:160;display:grid;place-items:center;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);border-radius:12px;box-shadow:var(--shadow-lg);width:100%;max-width:520px;max-height:calc(100dvh - 32px);display:flex;flex-direction:column;animation:rise .18s ease}
.modal.wide{max-width:760px}
@keyframes rise{from{transform:translateY(10px);opacity:0}}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-h h3{margin:0;font-size:16px;flex:1}
.modal-b{padding:18px;overflow-y:auto}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.menu{position:fixed;z-index:170;background:var(--surface);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow-lg);padding:5px;min-width:180px}
.menu button{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;padding:7px 10px;border-radius:6px;font-size:13px;text-align:left}
.menu button:hover{background:var(--surface-2)}
.menu button.danger{color:var(--bad)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.pop{position:fixed;z-index:165;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lg);width:340px;max-width:calc(100vw - 32px)}
.pop-h{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);gap:8px}
.pop-h b{flex:1}
.toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:200;display:grid;gap:8px;justify-items:center;pointer-events:none;width:calc(100% - 32px);max-width:440px}
.toast{background:#13232c;color:#e8f0f3;border-radius:9px;padding:10px 14px;font-size:13px;box-shadow:var(--shadow-lg);display:flex;gap:10px;align-items:center;animation:rise .2s ease;pointer-events:auto}
.toast .ic{color:#6fdca0}
.toast.warn .ic{color:#f2c46b} .toast.bad .ic{color:#ff8b83} .toast.info .ic{color:#8fc0f5}
.dock{position:fixed;right:16px;bottom:16px;z-index:90;width:340px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lg)}
.dock-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;font-weight:600}
.dock-h .sp{flex:1}
.dock-b{max-height:240px;overflow:auto;padding:6px 12px 10px;display:grid;gap:10px}
.xfer{display:grid;gap:4px;font-size:12.5px}
.xfer .l{display:flex;gap:8px;align-items:center}
.xfer .l span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xfer .meter{height:5px}

/* full-screen overlays: wizard, login, restart */
.fullscreen{position:fixed;inset:0;z-index:150;background:var(--bg);overflow:auto;display:grid;place-items:center;padding:24px 16px}
.fullscreen.dark{background:radial-gradient(1200px 600px at 20% 0%,#16323b,#0a1216 60%);color:#e1e8ed}
.wiz{width:100%;max-width:960px;display:grid;grid-template-columns:260px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);overflow:hidden;min-height:560px}
.wiz-side{background:var(--side);color:var(--side-ink);padding:22px 18px;display:grid;align-content:start;gap:18px}
.wiz-steps{list-style:none;margin:0;padding:0;display:grid;gap:2px;counter-reset:s}
.wiz-steps li{display:flex;align-items:center;gap:11px;padding:8px 8px;border-radius:7px;font-size:13.5px;color:var(--side-muted)}
.wiz-steps li i{width:24px;height:24px;border-radius:50%;border:1.5px solid #2b4552;display:grid;place-items:center;font-style:normal;font-size:11.5px;font-weight:600;flex:none}
.wiz-steps li.on{background:var(--side-3);color:#fff}
.wiz-steps li.on i{border-color:var(--side-accent);color:var(--side-accent)}
.wiz-steps li.done{color:var(--side-ink)}
.wiz-steps li.done i{background:#1f7f5a;border-color:#1f7f5a;color:#fff}
.wiz-main{display:flex;flex-direction:column;min-width:0}
.wiz-body{flex:1;padding:34px 36px 24px;display:grid;align-content:start;gap:18px}
.wiz-body h2{margin:0;font-size:24px;letter-spacing:-.01em;text-wrap:balance}
.wiz-body p.lead{font-size:14px}
.wiz-foot{display:flex;gap:8px;align-items:center;padding:14px 36px;border-top:1px solid var(--line)}
.wiz-foot .sp{flex:1}
.wiz-note{font-size:12px;color:var(--warn);background:var(--warn-soft);border-radius:7px;padding:8px 11px;display:flex;gap:8px;align-items:center}
.scan-log{font-family:var(--mono);font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:3px;color:var(--ink-2);min-height:120px}
.det{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:9px;padding:12px 14px;animation:rise .25s ease}
.det .t{flex:1}
.det b{display:block}
.det small{color:var(--muted)}
.opt-card{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:9px;padding:12px 14px;cursor:pointer;background:var(--surface)}
.opt-card:hover{border-color:var(--line-2)}
.opt-card.on{border-color:var(--accent);background:var(--accent-soft)}
.opt-card input{accent-color:var(--accent)}
.opt-card .t{flex:1}
.opt-card b{display:block;font-size:13.5px}
.opt-card small{color:var(--muted);font-size:12px}
.steps-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.steps-list li{display:flex;gap:10px;align-items:center;font-size:13.5px;color:var(--muted)}
.steps-list li.done{color:var(--ink)}
.steps-list li .sb{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line-2);flex:none}
.steps-list li.done .sb{background:var(--ok);border-color:var(--ok);color:#fff}
.steps-list li.cur .sb{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.strength{display:flex;gap:4px}
.strength i{flex:1;height:5px;border-radius:3px;background:var(--surface-3)}
.login{width:100%;max-width:380px;background:rgba(18,30,37,.86);border:1px solid #21363f;border-radius:14px;padding:28px;display:grid;gap:16px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.login .input{background:#0e181d;border-color:#2a3f49;color:#e1e8ed}
.login label{color:#a8b6c0}
.login h2{margin:0;font-size:20px}
.login p{margin:0;color:#8ea0aa;font-size:13px}
.restart{display:grid;justify-items:center;gap:14px;text-align:center}
.spinner{width:42px;height:42px;border-radius:50%;border:3px solid #24404b;border-top-color:var(--side-accent);animation:spin .9s linear infinite}

/* ---------- Responsive ---------- */
@media (max-width:1280px){
  .g-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bk-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:1100px){

function readPicture(file) {

  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 1920 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);

  const cap = (role, c) => { const on = S.perms[role].c[c]; const locked = role === 'Administrator'; return `<button class="yesno ${on ? 'y' : 'n'}" data-act="cap-toggle" data-role="${role}" data-c="${esc(c)}" ${locked ? 'disabled' : ''} aria-label="${esc(role)}: ${esc(c)} ${on ? 'allowed' : 'denied'}">${ic(on ? 'check' : 'x', 15, 2.4)}</button>`; };

/* ---------- Security ---------- */
function secScore() {
  const s = S.settings;
  const items = [
    ['HTTPS enforced', s.security.forceHttps, 'forceHttps'],
    ['Automatic IP blocking', s.security.autoBlock, 'autoBlock'],
    ['Sign-in alerts', s.security.loginAlerts, 'loginAlerts'],
    ['2FA required for administrators', s.users.require2faAdmins, 'require2faAdmins'],
    ['Strong password policy', s.users.complex && s.users.minPassword >= 10, 'complex'],
    ['New devices need approval', s.remote.approveNew, 'approveNew'],
  ];
  const score = Math.round(40 + items.filter(i => i[1]).length / items.length * 60);
  return { items, score };
}
PAGES.security = () => {
  const s = S.settings.security;
  const { items, score } = secScore();
  const recent = S.failed.filter(f => Date.now() - f.ts < DAY);
  const tile = (label, val, tone, icon) => card(null, `<div class="sec-tile"><span class="s-ic ${tone}">${ic(icon, 20)}</span><div class="t"><span>${label}</span><b>${val}</b></div></div>`);
  return `<div class="grid g-4">
    ${tile('HTTPS', s.forceHttps ? 'Active' : 'Optional', s.forceHttps ? 't-ok' : 't-warn', 'lock')}
    ${tile('Authentication', 'Enabled', 't-ok', 'user')}
    ${tile('Two-factor authentication', S.settings.users.require2faAdmins ? 'Required for admins' : 'Available', S.settings.users.require2faAdmins ? 't-ok' : 't-info', 'shieldok')}
    ${tile('Firewall', s.firewall.startsWith('Protected') ? 'Protected' : 'Basic', s.firewall.startsWith('Protected') ? 't-ok' : 't-warn', 'shield')}
  </div>
  <div class="grid g-1-2" style="margin-top:16px">
    ${card('Security score', `<div class="card-b"><div style="display:flex;gap:16px;align-items:center;margin-bottom:10px">${donut(score, 110, 11, 'of 100', score >= 90 ? 'var(--ok)' : score >= 75 ? 'var(--accent)' : 'var(--warn)')}<div><b style="font-size:15px">${score >= 90 ? 'Strong' : score >= 75 ? 'Good' : 'Needs attention'}</b><p class="lead">${items.filter(i => !i[1]).length ? items.filter(i => !i[1]).length + ' recommendation' + (items.filter(i => !i[1]).length > 1 ? 's' : '') + ' below' : 'All recommendations applied'}</p></div></div>
      <ul class="checklist">${items.map(([l, ok, k]) => `<li><span style="color:${ok ? 'var(--ok)' : 'var(--warn)'}">${ic(ok ? 'check' : 'alert', 16, 2.2)}</span>${l}<span class="sp"></span>${ok ? '' : `<button class="btn sm" data-act="sec-fix" data-k="${k}">Turn on</button>`}</li>`).join('')}</ul></div>`, { icon:'shieldok' })}
    ${card('Failed login attempts', `<div class="card-b" style="display:flex;gap:24px;flex-wrap:wrap;padding-bottom:6px"><div><div class="big-stat">${recent.length}<small> last 24 h</small></div></div><div><div class="big-stat">${S.blocked.length}<small> IPs blocked</small></div></div></div>
      <div class="table-wrap"><table class="tbl"><thead><tr><th>Time</th><th>Username</th><th>Source</th><th class="hide-md">Reason</th><th class="r">Action</th></tr></thead><tbody>
      ${S.failed.map(f => { const bl = S.blocked.includes(f.ip.split(' ')[0]); return `<tr><td class="muted">${rel(f.ts)}</td><td><b style="font-weight:600">${esc(f.user)}</b></td><td class="mono">${esc(f.ip)}</td><td class="hide-md">${esc(f.reason)}</td><td class="r">${f.ip.includes('local') ? '<span class="muted">Local</span>' : bl ? `<button class="btn sm" data-act="ip-unblock" data-ip="${esc(f.ip)}">Unblock</button>` : `<button class="btn sm danger" data-act="ip-block" data-ip="${esc(f.ip)}">${ic('ban', 14)} Block</button>`}</td></tr>`; }).join('')}
      </tbody></table></div>`, { icon:'alert' })}
  </div>

/* ---------- Backup ---------- */
function nextBackupText() {
  const b = S.backup;
  if (!b.enabled) return 'Not scheduled';
  if (b.freq === 'Daily') return `Tomorrow ${time12(b.time)}`;
  if (b.freq === 'Weekly') return `${b.day} ${time12(b.time)}`;
  return `In 1 hour`;
}
const STAGES = ['Preparing', 'Scanning changes', 'Copying files', 'Verifying', 'Finished'];
PAGES.backup = () => {
  const b = S.backup, lastB = b.history[0];
  const dest = S.drives.find(d => d.name === b.dest) || S.drives[1];
  const dp = dest ? dest.used / dest.cap * 100 : 0;
  return `<section class="card">
    <div class="card-h"><h2>${ic('backup', 15)}Automatic backup</h2><span class="sp"></span>${sw(b.enabled, 'backup-enable', 'aria-label="Automatic backup"')}</div>
    <div class="card-b" style="padding-bottom:14px"><p class="lead">Copies your shared folders to the ${esc(b.dest)} drive on a schedule. Old versions are kept for ${b.retention} days.</p></div>
    <div class="bk-grid">
      <div><span>Automatic backup</span><b><span class="dot-s ${b.enabled ? 'ok' : ''}"></span>${b.enabled ? 'Enabled' : 'Disabled'}</b></div>
      <div><span>Schedule</span><b>${b.freq === 'Weekly' ? `Weekly · ${b.day}` : b.freq} — ${time12(b.time)}</b></div>
      <div><span>Backup destination</span><b>${esc(b.dest)} drive</b></div>
      <div><span>Last backup</span><b>${lastB ? `<span class="pill ${lastB.status === 'Completed' ? 'ok' : lastB.status === 'Failed' ? 'bad' : 'warn'}">${lastB.status === 'Completed' ? 'Completed' : lastB.status}</span>` : '—'}</b><div class="muted" style="font-size:12px;margin-top:3px">${lastB ? fmtDate(lastB.ts) : ''}</div></div>
      <div><span>Next backup</span><b>${nextBackupText()}</b></div>
    </div>
    <div class="card-b stack">
      ${b.running ? `<div class="progress-box"><div class="l"><b>${STAGES[b.stage]}…</b><span class="num">${b.progress.toFixed(0)}%</span></div><div class="meter lg"><i style="width:${b.progress}%"></i></div><div class="stages">${STAGES.slice(0, 4).map((s, i) => `<span class="${i < b.stage ? 'done' : i === b.stage ? 'cur' : ''}">${s}</span>`).join('')}</div></div>` : ''}
      <div class="btn-row">
        <button class="btn primary" data-act="backup-now" ${b.running ? 'disabled' : ''}>${ic('upload', 16)} ${b.running ? 'Backing up…' : 'Backup now'}</button>
        <button class="btn" data-act="backup-history">${ic('clock', 16)} View backup history</button>
        <button class="btn" data-act="backup-restore" ${b.running ? 'disabled' : ''}>${ic('restore', 16)} Restore</button>
        <button class="btn" data-act="backup-settings">${ic('settings', 16)} Backup settings</button>
      </div>
    </div>
  </section>
  <div class="grid g-2-1" style="margin-top:16px">

      ${card('Destination', `<div class="card-b stack" style="gap:10px"><div style="display:flex;justify-content:space-between"><b>${esc(dest.name)} · ${dest.type}</b><span class="pill ok">${dest.health}</span></div>${meter(dp, meterCls(dp))}<div class="muted" style="font-size:12.5px">${fmtBytes(dest.used)} used · ${fmtBytes(dest.cap - dest.used)} free · about ${Math.floor((dest.cap - dest.used) / (0.4*GB))} more daily versions fit</div></div>`, { icon:'storage' })}

function historyTable(rows) {
  return `<div class="table-wrap card-b flush"><table class="tbl"><thead><tr><th>Date</th><th class="hide-md">Type</th><th class="r">Size</th><th class="r hide-md">Files</th><th class="hide-md">Duration</th><th>Result</th></tr></thead><tbody>

const LOG_CATS = [['all','All'],['file','Files'],['login','Sign-ins'],['device','Devices'],['security','Security'],['backup','Backup'],['user','Users'],['storage','Storage'],['settings','Settings'],['system','System']];

function openMenu(anchor, items) {

  const m = root.firstChild; const mw = m.offsetWidth, mh = m.offsetHeight;
  let left = Math.min(r.right - mw, innerWidth - mw - 8); left = Math.max(8, left);
  let top = r.bottom + 4; if (top + mh > innerHeight - 8) top = Math.max(8, r.top - mh - 4);
  m.style.left = left + 'px'; m.style.top = top + 'px';

}

function renderDock() {
  const root = document.getElementById('dock-root');
  if (!S.transfers.length) { root.innerHTML = ''; return; }
  const active = S.transfers.filter(t => !t.done).length;
  root.innerHTML = `<div class="dock"><div class="dock-h">${ic(active ? 'refresh' : 'check', 16)}<span>${active ? `Transferring ${active} file${active > 1 ? 's' : ''}` : 'Transfers complete'}</span><span class="sp"></span>${active ? '' : `<button class="btn icon ghost" data-act="dock-clear" aria-label="Close transfers">${ic('x', 16)}</button>`}</div>
    <div class="dock-b">${S.transfers.map(t => `<div class="xfer"><div class="l">${ic(t.dir === 'up' ? 'upload' : 'download', 14)}<span>${esc(t.name)}</span><b class="num" style="font-weight:500;color:var(--muted)">${t.done ? (t.dir === 'up' ? 'Uploaded' : 'Done') : Math.floor(t.progress) + '%'}</b></div>${meter(t.progress, t.done ? '' : 'info')}</div>`).join('')}</div>
    <div class="card-f muted" style="font-size:11.5px;padding:8px 12px">Simulated transfer. ${S.transfers.some(t => t.dir === 'down') ? 'No file is saved to your device.' : ''}</div></div>`;
}
function startTransfer(name, size, dir, folder) {
  S.transfers.push({ id:'t' + Math.random().toString(36).slice(2), name, size, dir, folderId: folder && folder.id, progress: 0, done: false });
  renderDock();
}
setInterval(() => {
  let changed = false, landed = false;
  for (const t of S.transfers) {
    if (t.done) continue;
    t.progress = Math.min(100, t.progress + clamp(900 / Math.max(1, Math.log10(t.size) * 4), 2, 35) * rnd(.5, 1.3));
    changed = true;
    if (t.progress >= 100) {
      t.done = true;
      if (t.dir === 'up') {
        const f = NODES.get(t.folderId) || S.fs;
        let name = t.name, i = 1; while (f.children.some(c => c.name === name)) { const dot = t.name.lastIndexOf('.'); name = t.name.slice(0, dot) + ` (${i++})` + t.name.slice(dot); }
        const n = mkFile(name, t.size, nowIso(), S.session.user); n.parent = f; f.children.push(n); f.modified = n.modified;
        addLog('file', 'File uploaded', `${pathOf(n)} · ${fmtBytes(t.size)}`, 'ok');
        landed = true;
      } else addLog('file', 'File downloaded', t.name, 'info');
    }
  }
  if (landed && (S.page === 'files' || S.page === 'dashboard')) render(); else if (changed) renderDock();
  if (changed && S.transfers.length && S.transfers.every(t => t.done)) {
    clearTimeout(dockTimer);
    dockTimer = setTimeout(() => { if (S.transfers.every(t => t.done)) { S.transfers = []; renderDock(); } }, 4000);
  }
}, 350);
let dockTimer = null;

let backupTimer = null;
function runBackup(manual = true) {
  const b = S.backup; if (b.running) return;
  b.running = true; b.progress = 0; b.stage = 0;
  addLog('backup', 'Backup started', manual ? 'Manual backup → ' + b.dest : 'Scheduled backup', 'info');
  render();
  const t0 = Date.now();
  backupTimer = setInterval(() => {
    b.progress = Math.min(100, b.progress + rnd(1.5, 4.5));
    b.stage = b.progress < 6 ? 0 : b.progress < 22 ? 1 : b.progress < 86 ? 2 : b.progress < 100 ? 3 : 4;
    if (b.progress >= 100) {
      clearInterval(backupTimer); b.running = false;
      const prev = b.history[0];
      const size = (prev ? prev.size : 48*GB) + rnd(0.05, 0.4) * GB;
      b.history.unshift({ id:'b' + Date.now(), ts: Date.now(), type: manual ? 'Manual' : 'Scheduled', size, files: (prev ? prev.files : 18400) + Math.floor(rnd(3, 40)), dur: `${Math.max(1, Math.round((Date.now() - t0) / 1000))} sec (demo)`, status:'Completed' });
      const dest = S.drives.find(d => d.name === b.dest); if (dest) dest.used = Math.min(dest.cap, dest.used + 0.4*GB);
      addLog('backup', 'Backup completed', `${fmtBytes(size)} → ${b.dest} drive`, 'ok', 'system', 'Scheduler');
      notify(`Backup completed (${fmtBytes(size)})`, 'ok');
      toast('Backup completed');
    }
    if (S.page === 'backup') render();
  }, 250);
}

function remoteConnect() {

    if (S.settings.remote.autoReconnect) S.devices.forEach(d => { if (d.status === 'Offline' && d.trusted) { d.status = 'Connected'; d.since = Date.now(); } });
    addLog('system', 'Remote access connected', 'Secure relay · ' + S.settings.remote.relay, 'ok', 'system', 'Relay');
    toast('Remote access connected'); render();
  }, 2200);
}
function pairModal() {
  const code = Array.from({ length: 6 }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 31)]).join('');
  const cells = [];
  for (let y = 0; y < 21; y++) for (let x = 0; x < 21; x++) {
    const F = [[0, 0], [14, 0], [0, 14]].find(([a, b]) => x >= a && x < a + 7 && y >= b && y < b + 7);
    let on;
    if (F) { const lx = x - F[0], ly = y - F[1]; on = lx === 0 || lx === 6 || ly === 0 || ly === 6 || (lx >= 2 && lx <= 4 && ly >= 2 && ly <= 4); }
    else if ((x < 8 && y < 8) || (x > 12 && y < 8) || (x < 8 && y > 12)) on = false;
    else on = Math.random() > .52;
    cells.push(`<i class="${on ? '' : 'w'}"></i>`);
  }
  openModal({ title:'Connect a device', body: `<div style="display:flex;gap:20px;flex-wrap:wrap;align-items:center">
      <div class="qr" aria-label="Sample pairing code image">${cells.join('')}</div>
      <div class="stack" style="gap:10px;flex:1;min-width:200px"><div class="muted" style="font-size:12.5px">Pairing code</div><div class="pair-code">${code}</div>
        <div style="font-size:13px">Scan the code with the device's camera, or open <span class="mono">${S.server.address}</span> and enter the code. It expires in 10 minutes.</div></div></div>
      <div class="field" style="margin-top:16px"><label for="pd-name">Simulate a new device</label><select class="select" id="pd-name"><option value="phone">Android Phone (2)</option><option value="laptop">Office Desktop PC</option><option value="tablet">Meeting Room Tablet</option></select></div>
      <div class="wiz-note" style="margin-top:12px">${ic('info', 15)} Sample image, not a working code. Nothing is sent over the network.</div>`,
    buttons: [{ label:'Close', fn: closeModal }, { label:'Simulate device joining', cls:'primary', fn: () => {
      const k = document.getElementById('pd-name').value;
      const names = { phone:['Android Phone (2)','Android 15'], laptop:['Office Desktop PC','Windows 11'], tablet:['Meeting Room Tablet','Android 14 (tablet)'] };
      const [nm, os] = names[k];
      if (S.devices.some(d => d.name === nm)) { toast(`${nm} is already connected`, 'warn'); return; }
      S.devices.push({ id:'dv' + Date.now(), name:nm, kind:k === 'laptop' ? 'monitor' : k, user:'employee01', os, via:'Secure relay', since: Date.now(), status:'Connected', trusted: !S.settings.remote.approveNew });
      S.sessions.push({ id:'s' + Date.now(), user:'employee01', device:nm, ip:'Remote · relay', started: Date.now() });
      addLog('device', 'New device connected', `${nm} via secure relay`, 'info', 'employee01', nm);

    } }] });

function wizNext() {
  const w = S.wiz; w.err = {};
  if (w.step === 1) { if (!w.name.trim()) { w.err.name = 'Enter a server name.'; return renderWiz(); } }
  if (w.step === 4) {
    if (!/^[a-z0-9._-]{3,24}$/i.test(w.user)) { w.err.user = 'Use 3–24 letters, numbers, dots, dashes or underscores.'; return renderWiz(); }
    if (w.pass.length < 8) { w.err.pass = 'Password must be at least 8 characters.'; return renderWiz(); }
    if (w.pass !== w.pass2) { w.err.pass = 'Passwords do not match.'; return renderWiz(); }
  }
  if (w.step === 6) {
    S.settings.general.serverName = w.name.trim();
    const admin = S.users.find(u => u.role === 'Administrator' && u.id === 'u1'); if (admin && admin.username !== w.user.toLowerCase()) { if (S.session.user === admin.username) S.session.user = w.user.toLowerCase(); admin.username = w.user.toLowerCase(); }

    if (w.backup !== 'NONE') S.backup.dest = w.backup; else S.backup.enabled = false;
    if (!w.remoteOn) { S.remote.state = 'off'; S.remote.enabled = false; S.settings.remote.enabled = false; S.devices.forEach(d => d.status = 'Offline'); }
    else if (S.remote.state !== 'connected') remoteConnect();

}

/* ---------- event delegation ---------- */
document.addEventListener('click', e => {
  const mi = e.target.closest('[data-mi]');
  if (mi) { const it = document.getElementById('menu-root')._items[Number(mi.dataset.mi)]; closeMenu(); it.fn(); return; }
  const mb = e.target.closest('[data-mbtn]');
  if (mb) { const b = modalBtns[Number(mb.dataset.mbtn)]; if (b && b.fn) b.fn(); return; }
  if (!e.target.closest('.menu')) closeMenu();
  if (!e.target.closest('.pop') && !e.target.closest('[data-act="notes"]')) closePop();
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = A[el.dataset.act];
  if (fn) { if (el.tagName === 'A') e.preventDefault(); fn(el, e); }
});
document.addEventListener('input', e => {
  const el = e.target;
  const ak = el.dataset.apinput;
  if (ak) {
    if (ak === 'accent') S.ap.accent = el.value; else if (ak === 'side') S.ap.sidebar = el.value;
    else if (ak === 'dim') S.ap.login.dim = Number(el.value); else S.ap.login[ak] = el.value;
    applyAppearance(); paintBg();
    if (ak === 'c1' || ak === 'c2') document.querySelectorAll('.bg-tile[data-k="color"]').forEach(t => t.style.background = `linear-gradient(160deg,${S.ap.login.c1},${S.ap.login.c2})`);
    if (ak === 'message') saveAp();
    return;
  }
  const k = el.dataset.input; if (!k) return;
  if (k === 'file-q') { S.fileQuery = el.value; S.sel.clear(); render(); }
  else if (k === 'log-q') { S.logQuery = el.value; render(); }
  else if (k === 'set') { const [a, b] = el.dataset.path.split('.'); S.setDraft[a][b] = el.type === 'number' ? Number(el.value) : el.value; updateDirty(); }
  else if (k === 'wz-name') { S.wiz.name = el.value; const p = document.getElementById('wz-prev'); if (p) p.textContent = el.value || 'Untitled server'; }
  else if (k === 'wz-user') S.wiz.user = el.value;
  else if (k === 'wz-pass' || k === 'wz-pass2') {
    S.wiz[k === 'wz-pass' ? 'pass' : 'pass2'] = el.value;
    const s = strength(S.wiz.pass), colors = ['var(--bad)', 'var(--bad)', 'var(--warn)', 'var(--accent)', 'var(--ok)'];
    const bar = document.getElementById('wz-str'); if (bar) bar.innerHTML = [0, 1, 2, 3].map(i => `<i style="${i < s ? 'background:' + colors[s] : ''}"></i>`).join('');
    const t = document.getElementById('wz-str-t'); if (t) t.textContent = S.wiz.pass ? ['Too short', 'Weak', 'Fair', 'Good', 'Strong'][s] : 'At least 8 characters. Mix letters, numbers and symbols.';
  }
});
document.addEventListener('change', e => {
  const el = e.target, k = el.dataset.change;
  if (el.dataset.apinput && el.dataset.apinput !== 'message') { refreshAp(); return; }
  if (k === 'ap-file') { readPicture(el.files && el.files[0]); el.value = ''; return; }
  if (el.name === 'rs-dest') { document.getElementById('rs-o1').classList.toggle('on', el.value === 'orig'); document.getElementById('rs-o2').classList.toggle('on', el.value === 'new'); }
  if (!k) return;
  if (k === 'file-sort') { S.fileSort = { key: el.value, dir: 1 }; render(); }
  else if (k === 'log-range') { S.logRange = el.value; render(); }
  else if (k === 'set') { const [a, b] = el.dataset.path.split('.'); const old = S.settings[a][b]; S.setDraft[a][b] = typeof old === 'number' ? Number(el.value) : el.value; updateDirty(); }
  else if (k === 'wz-radio') { S.wiz[el.dataset.g] = el.value; renderWiz(); }
  else if (k === 'wz-remote') { S.wiz.remoteOn = el.checked; wizClear(); renderWiz(); }
});
document.addEventListener('submit', e => {
  if (e.target.id === 'login-f') { e.preventDefault(); const u = document.getElementById('li-u').value.trim().toLowerCase() || 'admin'; const known = S.users.find(x => x.username === u && x.status === 'Active');
    if (!known) { addLog('security', 'Failed login attempt', `Unknown or disabled user “${u}”`, 'warn', u, 'This browser'); toast(`No active account named “${u}”`, 'bad'); return; }
    S.session.user = u; known.last = Date.now(); addLog('login', 'User logged in', 'Local network · this browser', 'info', u, '192.168.1.24'); document.getElementById('full-root').innerHTML = ''; render(); toast(`Signed in as ${u}`); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.getElementById('menu-root').innerHTML) return closeMenu();
    if (document.getElementById('pop-root').innerHTML) return closePop();
    if (document.getElementById('modal-root').innerHTML) return closeModal();
    if (S.wiz) return wizClose();
    document.getElementById('app').classList.remove('nav-open');
  }
  if (e.key === 'Enter' && e.target.closest && e.target.closest('.modal') && e.target.tagName === 'INPUT' && e.target.type !== 'checkbox' && e.target.type !== 'radio') {
    const primary = [...document.querySelectorAll('.modal-f [data-mbtn]')].find(b => b.classList.contains('primary')); if (primary) { e.preventDefault(); primary.click(); }
  }
  if (e.key === 'Enter' && S.wiz && e.target.closest && e.target.closest('.wiz-body') && e.target.tagName === 'INPUT' && e.target.type !== 'checkbox') { e.preventDefault(); wizNext(); }
});
addEventListener('resize', closeMenu);
addEventListener('scroll', closeMenu, true);
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { applyAppearance(); renderTop(); });

/* ==========================================================================
   LIVE SIMULATION TICK — updates numbers in place without re-rendering pages
   ========================================================================== */
function tick() {
  const m = S.m, busy = S.backup.running ? 22 : 0, xfer = S.transfers.some(t => !t.done);
  const push = (a, v) => { a.push(v); if (a.length > 60) a.shift(); };
  push(m.cpu, clamp(last(m.cpu) + rnd(-6, 6) + (18 + busy - last(m.cpu)) * .18, 3, 96));
  push(m.ram, clamp(last(m.ram) + rnd(-1, 1) + (busy ? .3 : 0), 36, 72));
  push(m.down, clamp(last(m.down) + rnd(-18, 18) + ((xfer ? 140 : 45) - last(m.down)) * .12, 2, 400));
  push(m.up, clamp(last(m.up) + rnd(-6, 6) + ((busy ? 60 : 14) - last(m.up)) * .12, 1, 200));
  m.temp = clamp(38 + last(m.cpu) * .14 + rnd(-.6, .6), 35, 75);
  const cpu = last(m.cpu), ram = last(m.ram);
  const set = (k, v) => document.querySelectorAll(`[data-live="${k}"]`).forEach(e => e.textContent = v);
  set('cpu', cpu.toFixed(0) + '%'); set('ram', ram.toFixed(0) + '%'); set('ramText', `${(ram * .16).toFixed(1)} / 16 GB`);
  set('down', `↓ ${last(m.down).toFixed(0)} Mbps`); set('net', `↓ ${last(m.down).toFixed(0)} · ↑ ${last(m.up).toFixed(0)} Mbps`);
  set('temp', m.temp.toFixed(0) + '°C'); set('uptime', uptime());
  document.querySelectorAll('[data-live-w]').forEach(e => e.style.width = (e.dataset.liveW === 'cpu' ? cpu : ram).toFixed(1) + '%');
  document.querySelectorAll('[data-spark]').forEach(e => e.innerHTML = sparkInner(e.dataset.spark));
}
setInterval(tick, 2000);

/* ---------- boot ---------- */
S.ap = loadAp(); applyAppearance();
S.setDraft = structuredClone(S.settings);
{ const h = (location.hash || '').slice(1); if (PAGES[h]) S.page = h; }
render();
</script>
