# Builds the My Private Server Windows installer (.msi) on a GitHub-hosted Windows machine,
# installs it there, runs the end-to-end self-test, and publishes the .msi as a GitHub Release.
# Download it from: Releases -> latest -> MyPrivateServer-<version>-x64.msi
name: Build Windows installer

on:
  push:
    branches: [claude/private-nas-prototype-o9rp7t, main]
    paths: ["my-private-server/**", ".github/workflows/build-installer.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: my-private-server
    env:
      VERSION: 0.3.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache downloaded components
        uses: actions/cache@v4
        with:
          path: my-private-server/installer/.cache
          key: components-${{ hashFiles('my-private-server/installer/components.json') }}

      - name: Unit and API tests
        run: dotnet test MyPrivateServer.sln -c Release

      - name: Build the MSI
        run: ./installer/build-installer.ps1 -Version $env:VERSION -SkipPrereqs

      - name: Install the MSI and run the self-test
        run: |
          $msi = Resolve-Path "installer/out/MyPrivateServer-$env:VERSION-x64.msi"
          ./installer/install-and-test.ps1 -Msi $msi -Test -NoBrowser
          Get-Content installer/out/self-test-report.txt
          if (Select-String -Path installer/out/self-test-report.txt -Pattern "FAILED" -Quiet) { throw "Self-test failed" }

      - name: Keep logs and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-logs-${{ env.VERSION }}
          path: |
            my-private-server/installer/out/*.log
            my-private-server/installer/out/*.txt
            C:/ProgramData/MyPrivateServer/logs/**
          if-no-files-found: ignore

      - name: Publish the installer as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $msi = "installer/out/MyPrivateServer-$env:VERSION-x64.msi"
          $notes = @"
          **My Private Server $env:VERSION for Windows 10/11 (64-bit)**

          1. Download MyPrivateServer-$env:VERSION-x64.msi below.
          2. Double-click it and click Install. If Windows shows "Windows protected your PC", click **More info** then **Run anyway** (the installer is not code-signed).
          3. When it finishes, the setup wizard opens at http://localhost:8080.

          Built and tested automatically on a clean Windows machine; the self-test report is attached.
          Built from commit $env:GITHUB_SHA.
          "@
          gh release create "v$env:VERSION" $msi installer/out/self-test-report.txt `
            --target $env:GITHUB_SHA --title "My Private Server $env:VERSION" --notes $notes --latest
